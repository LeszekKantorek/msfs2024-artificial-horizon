<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#10151b">
    <title>MSFS2024 PFD Demo</title>
    <link rel="stylesheet" href="/styles.css">
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <main>
      <header aria-label="Telemetry status">
        <span class="source">Source unavailable</span>
        <span id="data-status" data-state="waiting" role="status" aria-live="polite">Waiting for fresh telemetry</span>
        <span id="transport" role="status" aria-live="polite">Connecting…</span>
      </header>
      <section class="instrument" data-available="false" aria-label="Primary flight display">
        <svg role="img" aria-labelledby="instrument-title instrument-description">
          <title id="instrument-title">Aircraft attitude and coordinated turn</title>
          <desc id="instrument-description">Moving sky, ground and pitch ladder around a fixed aircraft reference. Bank scale, slip/skid ball and turn rate vector. Read the telemetry status before using the indications.</desc>
          <defs><clipPath id="attitude-clip"><rect/></clipPath><clipPath id="pitch-clip"><rect/></clipPath></defs>
          <g clip-path="url(#attitude-clip)">
            <g class="moving-world">
              <g id="world-rotation"><g id="world-pitch">
                <path class="sky"/><path class="ground"/>
                <path class="horizon-line"/>
              </g></g>
              <g clip-path="url(#pitch-clip)"><g id="scale-rotation"><g id="scale-pitch">
                <g id="pitch-ladder"/><g id="pitch-warnings"/>
              </g></g></g>
              <path id="bank-pointer"/>
            </g>
            <g id="fixed-symbols"><g id="bank-scale"/>
              <path class="aircraft-outline"/><path class="aircraft"/></g>
          </g>
          <g id="slip-skid" class="indication" data-available="false" aria-label="Slip/skid unavailable">
            <path class="slip-reference"/><circle class="slip-ball" r="5"/>
            <text class="local-unavailable">×</text>
          </g>
          <g id="turn-rate" class="indication" data-available="false" aria-label="Turn rate unavailable">
            <path class="turn-scale"/><path class="turn-vector"/><path class="turn-overflow"/>
            <text class="local-unavailable">×</text>
          </g>
          <g id="layout-fixtures"/>
        </svg>
        <div class="unavailable-panel"><span class="unavailable-mark" aria-hidden="true">×</span><p id="unavailable">Connecting…</p></div>
      </section>
      <noscript>Enable JavaScript to display telemetry.</noscript>
    </main>
  </body>
</html>
