name: Work Item
description: A problem, feature, or result to plan as executable Tasks.
title: "[Work Item]: "
labels: ["work-item"]
body:
  - type: markdown
    attributes:
      value: |
        Set the actual parent Initiative through GitHub's parent/sub-issue relationship after publication.
        The parent reference in this form does not create that relationship.
        Plan only the Tasks justified by current evidence. Completing current Tasks does not automatically complete this Work Item.
  - type: input
    id: parent
    attributes:
      label: Parent Initiative
      description: Identify the Initiative by issue number or URL, then verify its actual parent relationship after publication.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: State the concrete problem, capability, or result to deliver.
    validations:
      required: true
  - type: textarea
    id: requirements
    attributes:
      label: Requirements and constraints
      description: Include required behavior, exclusions, preserved contracts, and links to their canonical documentation.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Link relevant documentation sections and prior results. Distinguish confirmed findings, accepted decisions, and unknowns.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable results as Markdown checkboxes. Define the Work Item result rather than merely completing its children.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: Link prerequisite issues or state None.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation
      description: Define required checks, expected results, evidence, and unavailable equipment or information.
    validations:
      required: true
