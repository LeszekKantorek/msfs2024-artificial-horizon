name: Task
description: A self-contained implementation, diagnostic, research, documentation, or infrastructure assignment.
title: "[Task]: "
labels: ["task"]
body:
  - type: markdown
    attributes:
      value: |
        If there is nothing to enter in a field, use `N/A`.

        A parent Work Item can be linked through GitHub's Relationships control.

        Prepare and complete this Task under these requirements:

        * Include the testing and review applicable to this Task's outcome.
        * Verify the assigned result before completion. An investigation can deliver that result without code changes or a PR.
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: State the concrete behavior, investigation result, or other deliverable.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Identify affected modules or documents, exclusions, constraints, and behavior or contracts that must remain unchanged.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Link required document sections, useful checked line ranges, relevant code, and earlier results. Include enough context for another session.
    validations:
      required: true
  - type: textarea
    id: guidance
    attributes:
      label: Implementation guidance
      description: State the chosen direction, accepted decisions, assumptions, component responsibilities, dependencies, and required actions. Bound investigations without presuming their result.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable completion conditions and expected results as Markdown checkboxes.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: Link prerequisite issues or state N/A.
    validations:
      required: true
