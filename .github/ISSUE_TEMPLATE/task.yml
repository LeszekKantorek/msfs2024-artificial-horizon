name: Implementation task
description: A reviewable outcome with acceptance criteria and dependencies.
title: "[Task]: "
body:
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: What should users or contributors be able to do?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Include relevant architecture or contract references.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable results as Markdown checkboxes.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: Link prerequisite issues or state None.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation plan
      description: Automated tests, manual scenarios, and required hardware.
