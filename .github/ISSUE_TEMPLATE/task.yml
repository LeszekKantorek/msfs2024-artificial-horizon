name: Task
description: A problem, feature, or result to plan as executable Subtasks.
title: "[Task]: "
labels: ["task"]
body:
  - type: markdown
    attributes:
      value: |
        If there is nothing to enter in a field, use `N/A`.

        A parent Epic can be linked through GitHub's Relationships control.

        Prepare and maintain this Task under these requirements:

        * Base Subtask instructions on current evidence. Use diagnostic Subtasks when required findings are unavailable.
        * Confirm this Task's acceptance criteria before closing it. Completed Subtasks alone do not establish its result.
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: State the concrete problem, capability, or result to deliver.
    validations:
      required: true
  - type: textarea
    id: requirements
    attributes:
      label: Requirements and constraints
      description: Include required behavior, exclusions, preserved contracts, and links to their canonical documentation.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Link relevant documentation sections and prior results. Distinguish confirmed findings, accepted decisions, and unknowns.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable results as Markdown checkboxes. Define the Task result rather than merely completing its children.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: Link prerequisite issues or state N/A.
    validations:
      required: true
