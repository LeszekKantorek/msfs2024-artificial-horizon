name: Bug report
description: Report incorrect behavior as a Work Item. A confirmed cause or proposed fix is not required.
title: "[Bug]: "
labels: ["work-item", "bug"]
body:
  - type: markdown
    attributes:
      value: |
        This report is a Work Item and must meet these requirements:

        * Describe observed behavior separately from suspected causes. A confirmed cause or proposed fix is not required.
        * After publication, set and verify the actual parent Initiative through GitHub's parent/sub-issue relationship.
          The parent reference in this form does not create that relationship.
  - type: input
    id: parent
    attributes:
      label: Parent Initiative
      description: Identify the Initiative by issue number or URL, then verify its actual parent relationship after publication.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: App commit/version, source mode, OS, simulator/aircraft, phone, and browser.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List the observable results of the fix as Markdown checkboxes.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Logs, screenshots, and measurements. Remove private information.
