name: Bug report
description: Report incorrect behavior and how users can verify the correction.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        If there is nothing to enter in a field, use `N/A`.

        Describe observed behavior separately from suspected causes. A confirmed cause or proposed fix is not required.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: App commit/version, source mode, OS, simulator/aircraft, phone, and browser.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Describe how an end user can verify the fix and its expected results as Markdown checkboxes.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Logs, screenshots, and measurements. Remove private information.
