name: Bug report
description: Report incorrect behavior as a Task. A confirmed cause or proposed fix is not required.
title: "[Bug]: "
labels: ["task", "bug"]
body:
  - type: markdown
    attributes:
      value: |
        If there is nothing to enter in a field, use `N/A`.

        A parent Epic can be linked through GitHub's Relationships control.

        This report is a Task and must meet these requirements:

        * Describe observed behavior separately from suspected causes. A confirmed cause or proposed fix is not required.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: App commit/version, source mode, OS, simulator/aircraft, phone, and browser.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List the observable results of the fix as Markdown checkboxes.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Logs, screenshots, and measurements. Remove private information.
