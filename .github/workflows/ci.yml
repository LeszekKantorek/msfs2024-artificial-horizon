name: Windows Rust
on:
  push:
    branches:
      - main
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-latest
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust stable
        shell: pwsh
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Record tested toolchain
        run: rustc --version --verbose
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Tests
        run: cargo test --locked --all-targets
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Browser controller checks
        run: node --test tests/*.test.mjs
      - name: Build
        run: cargo build --locked --target x86_64-pc-windows-msvc
      - name: SDK-free SimConnect boundary
        run: cargo clippy --locked --all-targets --features simconnect -- -D warnings
      - name: Tests with SimConnect feature
        run: cargo test --locked --all-targets --features simconnect
