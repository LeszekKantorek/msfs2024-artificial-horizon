name: Windows Rust
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install recorded toolchain
        shell: pwsh
        run: rustup show
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Tests
        run: cargo test --locked --all-targets
      - name: Build
        run: cargo build --locked --target x86_64-pc-windows-msvc
      - name: SDK-free SimConnect boundary
        run: cargo clippy --locked --all-targets --features simconnect -- -D warnings
      - name: Tests with SimConnect feature
        run: cargo test --locked --all-targets --features simconnect
