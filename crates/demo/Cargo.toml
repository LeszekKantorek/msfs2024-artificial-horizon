[package]
name = "msfs2024-demo"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
name = "demo"
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_LibraryLoader", "Win32_System_Threading"] }

[[test]]
name = "dll_client"
harness = false
